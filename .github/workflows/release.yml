name: Release Process

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if not from dev merge'
        required: false
        default: 'false'
        type: boolean
      publish_pypi:
        description: 'Publish to PyPI'
        required: false
        default: 'true'
        type: boolean
      publish_docker:
        description: 'Publish Docker images'
        required: false
        default: 'true'
        type: boolean
      create_github_release:
        description: 'Create GitHub release'
        required: false
        default: 'true'
        type: boolean
      merge_back_to_dev:
        description: 'Merge back to dev and bump version'
        required: false
        default: 'false'
        type: boolean

jobs:
  # Check if this push is from a dev branch merge
  check-merge-source:
    runs-on: ubuntu-latest
    outputs:
      is-dev-merge: ${{ steps.check.outputs.is-dev-merge }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if merge is from dev branch
        id: check
        run: |
          echo "Event: ${{ github.event_name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Manual workflow dispatch triggered"
            if [[ "${{ github.event.inputs.force_release }}" == "true" ]]; then
              echo "✅ Force release enabled - proceeding"
              echo "is-dev-merge=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️  Manual trigger without force_release - checking current branch is master"
              if [[ "${{ github.ref_name }}" == "master" ]]; then
                echo "✅ On master branch - proceeding with manual release"
                echo "is-dev-merge=true" >> $GITHUB_OUTPUT
              else
                echo "❌ Not on master branch for manual release"
                echo "is-dev-merge=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "Checking merge source..."
            echo "Commit message: ${{ github.event.head_commit.message }}"

            # Check if this is a merge commit from dev
            if [[ "${{ github.event.head_commit.message }}" == *"Merge pull request"* ]] && \
               [[ "${{ github.event.head_commit.message }}" == *"/dev"* ]]; then
              echo "✅ Detected merge from dev branch"
              echo "is-dev-merge=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Not a dev branch merge - skipping release"
              echo "is-dev-merge=false" >> $GITHUB_OUTPUT
            fi
          fi

  # Main release job
  release:
    needs: check-merge-source
    if: needs.check-merge-source.outputs.is-dev-merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write  # Required for PyPI Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use GITHUB_TOKEN which has permissions to bypass branch protection
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Read and clean version
        id: version
        run: |
          # Read current version and clean it
          CURRENT_VERSION=$(cat abm/VERSION)
          # Handle both -dev0 and -dev.11 formats, plus -rc variants
          CLEAN_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-dev[0-9.]*$//' | sed 's/-rc[0-9.]*$//')

          # Calculate next dev version (minor bump)
          IFS='.' read -r major minor patch <<< "$CLEAN_VERSION"
          NEXT_MINOR=$((minor + 1))
          NEXT_DEV_VERSION="${major}.${NEXT_MINOR}.0-dev0"

          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "clean-version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "next-dev-version=$NEXT_DEV_VERSION" >> $GITHUB_OUTPUT

          echo "Current version: $CURRENT_VERSION"
          echo "Clean version: $CLEAN_VERSION"
          echo "Next dev version: $NEXT_DEV_VERSION"

      - name: Update version for release
        run: |
          echo "${{ steps.version.outputs.clean-version }}" > abm/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add abm/VERSION
          git commit -m "Release v${{ steps.version.outputs.clean-version }}"
          git push origin master

      - name: Create and push tag
        id: tag
        run: |
          TAG_NAME="v${{ steps.version.outputs.clean-version }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Python package
        run: |
          python -m build

      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OIDC Trusted Publisher - no API token required
          attestations: true

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_docker == 'true') }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_docker == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Docker image
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_docker == 'true') }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            quay.io/galaxyproject/abm:${{ steps.version.outputs.clean-version }}
            quay.io/galaxyproject/abm:latest
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub Release
        id: create-release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true') }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag-name }}
          release_name: ${{ steps.tag.outputs.tag-name }}
          body: |
            # gxabm ${{ steps.tag.outputs.tag-name }}

            This release includes all changes merged from the development branch.

            Release notes will be updated with detailed changes shortly...
          draft: false
          prerelease: false

      - name: Generate detailed release notes
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true') }}
        run: |
          # Get the previous tag for comparison
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.tag.outputs.tag-name }}^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            # Generate release notes between previous tag and current
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="${{ steps.tag.outputs.tag-name }}" \
              -f previous_tag_name="$PREV_TAG" > release-notes.json

            # Extract the generated notes
            GENERATED_NOTES=$(cat release-notes.json | jq -r '.body')

            # Update the release with detailed notes
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.id }} \
              -f body="# gxabm ${{ steps.tag.outputs.tag-name }}

            This release includes all changes merged from the development branch.

            ## What's Changed
            $GENERATED_NOTES

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ steps.tag.outputs.tag-name }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge master back to dev
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.merge_back_to_dev == 'true') }}
        run: |
          git checkout dev
          git pull origin dev
          git merge master --no-ff -m "Merge release ${{ steps.tag.outputs.tag-name }} back to dev"
          echo "${{ steps.version.outputs.next-dev-version }}" > abm/VERSION
          git add abm/VERSION
          git commit -m "Bump version to ${{ steps.version.outputs.next-dev-version }}"
          git push origin dev

      # Rollback on failure
      # Log workflow configuration
      - name: Log workflow configuration
        run: |
          echo "🔧 Workflow Configuration:"
          echo "=========================="
          echo "Event: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Force release: ${{ github.event.inputs.force_release }}"
            echo "Publish PyPI: ${{ github.event.inputs.publish_pypi }}"
            echo "Publish Docker: ${{ github.event.inputs.publish_docker }}"
            echo "Create GitHub release: ${{ github.event.inputs.create_github_release }}"
            echo "Merge back to dev: ${{ github.event.inputs.merge_back_to_dev }}"
          else
            echo "Auto-release from merge: all steps enabled"
          fi
          echo ""

      # Simplified rollback on failure
      - name: Rollback on failure
        if: failure()
        run: |
          echo "🚨 Release process failed. Starting cleanup..."

          RELEASE_TAG="${{ steps.tag.outputs.tag-name }}"
          RELEASE_ID="${{ steps.create-release.outputs.id }}"
          ORIGINAL_VERSION="${{ steps.version.outputs.current-version }}"

          # Delete the GitHub release if it was created
          if [ -n "$RELEASE_ID" ]; then
            echo "🗑️  Deleting GitHub release..."
            gh api --method DELETE -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/releases/$RELEASE_ID || echo "⚠️  Could not delete release"
          fi

          # Delete the Git tag (local and remote)
          if [ -n "$RELEASE_TAG" ]; then
            echo "🗑️  Deleting Git tag..."
            git tag -d "$RELEASE_TAG" || echo "⚠️  Could not delete local tag"
            git push --delete origin "$RELEASE_TAG" || echo "⚠️  Could not delete remote tag"
          fi

          # Reset the version file to original
          if [ -n "$ORIGINAL_VERSION" ]; then
            echo "🔄 Resetting version file..."
            echo "$ORIGINAL_VERSION" > abm/VERSION
            git add abm/VERSION
            git commit -m "Rollback: restore version to $ORIGINAL_VERSION after failed release" || echo "⚠️  Could not commit version rollback"
            git push origin master || echo "⚠️  Could not push version rollback"
          fi

          echo ""
          echo "📋 Cleanup Summary:"
          echo "==================="
          echo "❌ Release failed during: ${{ github.job }}"
          echo "🧹 Cleaned up: tag, release, version commit"
          echo "⚠️  PyPI/Docker artifacts may have been published (cannot be automatically removed)"
          echo ""
          echo "🔧 To retry:"
          echo "   1. Fix the issue that caused the failure"
          echo "   2. Use 'Run workflow' with selective publishing options"
          echo "   3. Or create a new dev→master PR"

          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}